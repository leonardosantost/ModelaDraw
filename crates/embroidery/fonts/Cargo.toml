[package]
name = "tracedraw-emb-fonts"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Digitized embroidery fonts for TraceDraw: reads embroidery font folders and lays out lettering as satins, fills and runs"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
tracedraw-emb-stitch.workspace = true
kurbo.workspace = true
serde.workspace = true
serde_json.workspace = true
roxmltree = "0.21"
svgtypes = "0.16"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
